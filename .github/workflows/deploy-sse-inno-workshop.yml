name: Deploy SSE Inno Digital Workshop to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'gm-social-economy-center/gm-sse-center-inno-digital-workshop/**'
      - '.github/workflows/deploy-sse-inno-workshop.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gm-social-economy-center/gm-sse-center-inno-digital-workshop
          destination_dir: gm-social-economy-center/gm-sse-center-inno-digital-workshop
          keep_files: true
